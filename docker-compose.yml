# =========================================================================
# Docker Compose for EduGrade Web Application
# Local Development, Staging & Single-Node Production Deployment
# =========================================================================

version: '3.8'

services:
  edugrade-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: edugrade:1.0.0
    container_name: edugrade-web-container
    restart: always
    ports:
      - "${HOST_PORT:-8080}:8080"
    environment:
      - PORT=8080
      - NODE_ENV=${NODE_ENV:-production}
      - APP_VERSION=${APP_VERSION:-1.0.0}
      - RELEASE_NAME=${RELEASE_NAME:-Genesis-Release}
      - DEBUG=false
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.10'
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
